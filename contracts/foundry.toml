[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true
# storageLayout is read by the bot to build simulation state overrides
extra_output = ["storageLayout"]
# Fork tests read their addresses from the bot config
fs_permissions = [{ access = "read", path = "../bot/config.example.toml" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
