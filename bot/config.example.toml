# Example configuration (Base mainnet, Morpho Blue). Copy to config.local.toml (git-ignored) and
# adjust. Every number below is a neutral starting point, not a tuned value: measure your own
# endpoints, gas and markets before going live.
chain_id = 8453
poll_ms = 1000
borrower_refresh_secs = 21600
watch_hf = 1.02
min_bonus = 1.0
journal_path = "data/journal.jsonl"

# RPC endpoints. URLs with API keys live in ../.env (git-ignored); the config only names the
# environment variables (`http_env`). Logs show endpoint names, never URLs.
env_file = "../.env"
log_chunk = 100            # max blocks per eth_getLogs call: the strictest endpoint's limit

# Endpoints are grouped by `priority` (0 = first tier; higher tiers are failover only). Within a
# tier, load follows latency x in-flight requests. `skip_methods` / `max_log_blocks` keep requests
# off endpoints that refuse them or are slow at them.
[[rpc]]
name = "primary"               # a keyed provider (archive + eth_simulateV1 recommended)
http_env = "BASE_RPC_1"
priority = 0
ws = "derive"                  # derive the WS URL from the HTTP one (wss://...), for newHeads

[[rpc]]
name = "secondary"             # a second keyed provider
http_env = "BASE_RPC_2"
priority = 0

[[rpc]]
name = "public"                # public endpoint: failover only
http = "https://mainnet.base.org"
priority = 2
skip_methods = ["eth_simulateV1", "eth_getLogs"]

[exec]
mode = "shadow"                # "live" also needs `watch --live`, a deployed liquidator and a keystore
# keystore = "/home/<you>/.foundry/keystores/bot-hot"   # created with `cast wallet import bot-hot --interactive`
# keystore_password_env = "BOT_KEYSTORE_PASSWORD"       # read once, then removed; else a prompt
# extra_broadcast = ["https://mainnet-sequencer.base.org"]   # opt-in; never in a fork/test config
# min_profit_keep = 0.5        # on-chain minProfit = simulated profit x this
# max_inflight = 1             # liquidation txs in flight at once (consecutive nonces, one per market); default 1
# max_failures_in_window = 3   # failed/dropped txs within failure_window_secs pause sending for
#                              # failure_cooldown_secs, then it resumes by itself
# liquidator = "0x..."         # set after deployment; until then simulations inject the bytecode
# venue = "callback"           # "callback" = MorphoLiquidator (Morpho funds the repayment in its callback)
#                              # "flash" = FlashLiquidator (flash-borrows the repayment: the path for
#                              # protocols without a liquidate callback; aggregator exits only)
# flash_liquidator = "0x..."   # deployed FlashLiquidator; unset = injected bytecode in simulations
# flash_funding = "morpho"     # "morpho" (Morpho Blue flash loan) or "v4" (Uniswap V4 flash accounting)
# pool_manager = "0x498581fF718922c3f8e6A244956aF099B2652b2b"   # Uniswap V4 PoolManager (Base)
# flash_headroom_bps = 10      # borrowed on top of the planned repayment (accrued interest)
executor = "0x000000000000000000000000000000000000dEaD"   # hot wallet ADDRESS only, never the key
liquidator_artifact = "../contracts/out/MorphoLiquidator.sol/MorphoLiquidator.json"
kyber_api = "https://aggregator-api.kyberswap.com/base/api/v1"
kyber_client_id = "liquidation-framework"   # free-text client id KyberSwap asks integrators to send
slippage_bps = 50
priority_fee_wei = 1000000     # 0.001 gwei
deadline_secs = 4.0            # tx valid this long; converted to blocks with the observed block time
replan_blocks = 5
# replan_secs = 10.0           # the same in seconds (overrides replan_blocks; follows the measured block time)
snapshot_max_age_ms = 1000     # reuse the last market snapshot on quiet heads until this old (skips the
                               # per-head eth_call: the main RPC egress under 200 ms blocks). 0 = off
# Spending limits (ledger.rs). A block-path tx is held to max_tx_cost_eth on its worst case
# (gas_limit x (2 x base fee + priority) + L1 fee): the bid is cut to fit, and not sent if the cut bid
# no longer beats the predicted competitor. Past daily_loss_limit_usd (realized: block path receipts
# minus the Atlas bond's shrinkage) the kill switch file is written.
# max_tx_cost_eth = 0.002
# daily_loss_limit_usd = 5.0
# ledger_file = ""             # empty = ~/.local/state/onchain-bots/ledger-<wallet> (next to the nonce files)
max_plans_per_block = 3
eth_usd_fallback = 2400.0      # until an on-chain ETH price is read
# Bidding (risk.rs, onchain_core::bid): just above what past winners paid per USD of gross, up to a
# share of the net that grows with its size; never below priority_fee_wei, never above the cap.
# max_priority_fee_wei = 1000000000   # hard cap (1 gwei)
# priority_fee_share = 0.3     # share of the net a small liquidation may bid...
# bid_share_large = 0.9        # ...rising to this at bid_large_net_usd (unset = priority_fee_share)
# bid_large_net_usd = 1000.0
# bid_quantile = 0.9           # beat 90% of past winners (priority per USD of gross)...
# bid_outbid_bps = 500         # ...by 5%
# bid_min_samples = 5          # winners needed before the model is used (per market, else all markets)
# bid_window_secs = 604800     # winners older than this are forgotten; seeded from the journal at start

[router]
mode = "best"                  # best = direct + aggregator (Kyber) in parallel, keep the better; or "direct" / "aggregator" ("kyber" = alias)

# V3-style factories for the self-built direct router. Venue addresses live in config, not code, so
# a DEX migration is a config edit.
[[router.factories]]
name = "uniV3"
address = "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
kind = "fee"
params = [100, 500, 3000, 10000]

[[router.factories]]
name = "pancakeV3"
address = "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
kind = "fee"
params = [100, 500, 2500, 10000]

[[router.factories]]
name = "slipstream"            # legacy Aerodrome Slipstream (CL), before the Aero merger
address = "0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A"
kind = "tick_spacing"
params = [1, 50, 100, 200, 2000]

# Aero CL (Aerodrome + Velodrome merger, 2026-10-21; Slipstream interface). Checked on-chain
# 2026-11-02 (block 53367000): tickSpacings() = [1, 10, 50, 100, 150, 200, 250]. Aero pools may tax
# the priority fee: plans are simulated again at the bid before sending (runner::checked_priority).
[[router.factories]]
name = "aero-cl"
address = "0x9CB220581b91b0C83223012FE69688b92aD07a76"
kind = "tick_spacing"
params = [1, 10, 50, 100, 200]

[[router.factories]]
name = "aero-cl2"
address = "0xC6bdE6e9F0CD71013E5FcF2dAAE2fA1c71Bb2F25"
kind = "tick_spacing"
params = [1, 10, 50, 100, 200]

# The lending protocol (Morpho Blue, the first LendingProtocol impl).
[morpho]
address = "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
api = "https://blue-api.morpho.org/graphql"

# Market allowlist: only these markets are tracked. Choose your own, and never include markets with
# untrusted collateral, loan tokens or oracles (fake-token markets exist on permissionless lending).
[[morpho.markets]]
name = "WETH/USDC"
id = "0x8793cf302b8ffd655ab97bd1c695dbd967807e8367a65cb2f4edaf1380ba1bda"

# Base Flashblocks (removed by Denim). The watch loop has no same-block path: enabled = true is
# refused. The stream is read by the fb_* examples only.
[flashblocks]
enabled = false
ws = "wss://mainnet.flashblocks.base.org/ws"

# Chainlink SVR / Atlas solver auctions: value every auction for the DappControl and journal it as
# kind atlas_auction; [atlas.solver] submit (live) also bids. The price model the auctions are
# valued with follows the aggregators' logs on a WebSocket endpoint (oracle_logs.rs).
[atlas]
observe = false
ws = "wss://svr-bid-endpoint.chain.link/ws/solver"
address = "0x583dcFef0D240DC80753F0F0B26513feE27D9B77"   # Atlas (Base)
svr_cutoff_secs = 10           # startup default only: an unauctioned SVR update takes effect once
                               # older than this. The live value is read per DualAggregator from its
                               # CutoffTimeSet log (oracle_logs.rs); this is used until the first one.
# rpc = ["secondary"]          # [[rpc]] names for auction valuations, in order (empty = the main pool)
# logs_ws = "primary"          # [[rpc]] name whose ws serves the oracle logs (empty = the first ws)
control = "0xa5E1a36938769cbd5a26f5e19D8FCB379f597c83"   # Base DappControl (Chainlink searcher docs)
margin = 0.05                  # journaled bid = bundle net (all positions sold as one exit) x (1 - margin)
max_plans = 5                  # largest positions also planned + simulated one by one
solver_gas_limit = 6000000     # the DappControl's solverGasLimit: liquidations + the bundle swap must fit
max_concurrent = 1             # valuations at once (they share the RPC pool)
paper_margins = [0.01, 0.05, 0.1]   # dashboard paper trading: bid = bundle net x (1 - m) vs the decoded winning bid
paper_deadline_ms = 2000       # a valuation later than this after the auction could not have bid in time

# The AtlasLiquidationSolver venue. simulate: the top position of each valued auction is also wrapped
# into a solver operation (bid from the auction policy, default its net x (1 - margin)) and simulated
# against an Atlas stand-in; the net after the bid is journaled. submit (live only, `watch --live`):
# the op is also signed and sent to the SVR bid endpoint (needs the deployed solver and a bond).
[atlas.solver]
simulate = false
# submit = false
# address = "0x..."            # deployed AtlasLiquidationSolver; unset = injected bytecode
# liquidator = "0x..."         # deployed MorphoLiquidator owned by the solver (executor = receiver = solver)
# signer = "0x..."             # the solver operation signer; default: exec.executor
# bid_router = "0x2626664c2603336E57B271c5C0b26F421741e481"   # Uniswap V3 SwapRouter02 (exactOutputSingle) for the ETH bid
# bid_fee = 500                # fee tier of the loan token / WETH pool the bid is bought in
# min_bond_eth = 0.01          # below this atlETH bond no op is submitted (checked at start and every 50 heads)
# atlas_bond_budget_usd = 2.0  # most the bond may shrink in a UTC day before ops stop until the next day

# `bot dashboard`: durable SQLite history + data/dashboard.html.
[dashboard]
# rpc = "secondary"            # [[rpc]] name for its own lookups (wallet balance, auction winners)
# backup_dir = "/path/to/backup"   # daily copy of metrics.db + journal
# db_path = "data/metrics.db"
# html_path = "data/dashboard.html"
# log_path = "data/run.log"
# raw_block_days = 14          # per-block rows; everything else is kept forever

# Labels for other liquidators' exit paths (dashboard only), beyond the built-in aggregators.
[[dashboard.contracts]]
name = "aerodrome-router"      # Aerodrome V2 router
address = "0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43"

[[dashboard.factories]]
name = "aerodrome-v2"          # Aerodrome V2 pool factory
address = "0x420DD381b31aEf6683db6B902084cB0FFECe40Da"
