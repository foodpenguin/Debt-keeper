[package]
name = "bot"
version = "0.1.0"
edition = "2024"
description = "Liquidation bot framework: generic health-factor engine and planner, Morpho Blue on Base as the first implementation"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
alloy = { version = "2.5.0", features = ["full", "json-rpc", "signer-local", "signer-keystore", "node-bindings"] }
anyhow = "1.0.104"
brotli = "8"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tower = { version = "0.5", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rand = "0.8"
